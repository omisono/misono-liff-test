<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手の運動｜御薗治療院</title>
  <style>
    :root { --green-dark:#14532d; --green:#16a34a; --green-bg:#eafbf1; --gray-text:#1f2937; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:linear-gradient(180deg,#eafbf1 0%,#ffffff 260px); color:var(--gray-text); padding:20px 16px 56px; }
    .container { max-width:480px; margin:0 auto; }
    .back-link { display:inline-block; font-size:15px; font-weight:bold; color:var(--green-dark); text-decoration:none; margin-bottom:8px; padding:6px 4px; }
    .clinic-header { text-align:center; margin-bottom:6px; }
    .clinic-header .name { font-size:21px; font-weight:bold; color:var(--green-dark); }
    h1 { text-align:center; font-size:26px; line-height:1.4; color:var(--green-dark); margin:12px 0 4px; }
    .subtitle { text-align:center; font-size:15px; line-height:1.7; color:#374151; margin:0 0 16px; font-weight:bold; }
    .prereq { background:#fff7ed; border:2px solid #fdba74; border-radius:18px; padding:16px; margin-bottom:18px; }
    .prereq b { display:block; font-size:17px; color:#9a3412; margin-bottom:6px; }
    .prereq p { margin:0; font-size:15.5px; line-height:1.9; color:#7c2d12; }
    .go { display:block; background:var(--green); color:#fff; text-align:center; text-decoration:none; font-weight:bold; font-size:17px; padding:16px 12px; border-radius:16px; margin-top:12px; box-shadow:0 6px 16px rgba(22,163,74,0.35); }
    .card { background:#fff; border-radius:22px; box-shadow:0 6px 18px rgba(22,101,52,0.10); padding:16px 16px 20px; margin-bottom:18px; }
    .card h2 { margin:0 0 4px; font-size:18px; line-height:1.45; color:var(--green-dark); }
    .card .cap { font-size:14px; color:#6b7280; margin:0 0 10px; line-height:1.7; }
    .video { position:relative; width:100%; padding-top:56.25%; border-radius:12px; overflow:hidden; background:#000; }
    .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .video.tall { width:68%; max-width:290px; margin:0 auto; padding-top:0; aspect-ratio:9/16; }
    .yt-link { display:block; text-align:center; margin-top:10px; font-size:14px; color:var(--green-dark); font-weight:bold; text-decoration:none; }
    .caution { background:#fef3c7; color:#92400e; border-radius:12px; padding:12px 14px; font-size:14.5px; line-height:1.8; font-weight:bold; }
    .foot { text-align:center; font-size:13px; color:#6b7280; margin-top:22px; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="selfcare.html">← セルフケアへ戻る</a>
    <div class="clinic-header"><div class="name">🌿 御薗治療院</div></div>
    <h1>手の運動</h1>
    <p class="subtitle">手・指をほぐす、かんたんな運動</p>

    <section class="card">
      <h2>参考動画</h2>
      <p class="cap">動画を見ながら、ゆっくり行ってみてください。</p>
      <div class="video">
        <iframe src="https://www.youtube.com/embed/VNtMEyLibGo?rel=0&playsinline=1" title="手の運動 参考動画" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
      </div>
      <a class="yt-link" href="https://www.youtube.com/watch?v=VNtMEyLibGo">動画が表示されないときは、YouTube で開く ›</a>
    </section>

    <div class="caution">痛みが強いときや、不安があるときは、無理をせず中止してご相談ください。</div>

    <div class="foot">御薗治療院</div>
  </div>
</body>
</html>
