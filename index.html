<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --green-dark: #14532d;
      --green: #16a34a;
      --green-bg: #eafbf1;
      --green-card: #f0fdf4;
      --gray-text: #4b5563;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #eafbf1 0%, #ffffff 260px);
      color: #1f2937;
      padding: 20px 16px 40px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .clinic-header { text-align: center; margin-bottom: 18px; }
    .clinic-header .name { font-size: 21px; font-weight: bold; color: var(--green-dark); }
    .card {
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 6px 18px rgba(22,101,52,0.10);
      padding: 28px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .wait-title { font-size: 32px; font-weight: bold; color: var(--green-dark); line-height: 1.4; }
    .wait-sub { font-size: 20px; color: var(--gray-text); margin-top: 12px; }
    .closed-days {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .reserve-info {
      text-align: center;
      font-size: 15px;
      color: #1e40af;
      background: #eff6ff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .tel-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 22px;
      font-weight: bold;
      color: #1e40af;
      text-decoration: none;
    }
    .debug {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .action-card {
      background: var(--green-card);
      border: 1px solid #dcfce7;
      border-radius: 22px;
      padding: 22px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 28px;
      margin: 6px;
      border: none;
      border-radius: 999px;
      background: var(--green);
      color: white;
      cursor: pointer;
    }
    .btn:active { background: var(--green-dark); }
    .btn-outline {
      background: white;
      color: var(--green-dark);
      border: 2px solid var(--green);
    }
    .hint { font-size: 13px; color: var(--gray-text); margin-top: 10px; }
    .status-text { font-size: 18px; font-weight: bold; color: var(--green-dark); margin-top: 10px; }
    .step-title { font-size: 18px; color: var(--green-dark); margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="clinic-header">
      <div class="name">🌿 御薗治療院</div>
    </div>

    <div class="card" id="wait_info">
      <div class="wait-title" id="wait_title">読み込み中...</div>
      <div class="wait-sub" id="wait_sub"></div>
    </div>

    <div class="closed-days" id="closed_days_info">
      定休日：日曜・祝日・月曜　／　水曜は午後休診
    </div>

    <div class="reserve-info" id="reserve_info">
      マッサージ・メタトロンなど、予約が必要な施術がございます。<br>
      ご希望の方はお電話でご予約ください。
      <div><a href="tel:0596227481" class="tel-link">📞 0596-22-7481</a></div>
    </div>

    <div class="debug" id="result">読み込み中...</div>

    <div class="action-card" id="checkin_area" style="display:none;">
      <button id="checkin_btn" class="btn">来院しました</button>
      <div class="status-text" id="checkin_status"></div>
    </div>

    <div class="action-card" id="coming_area" style="display:none;">
      <div id="coming_step_start">
        <button id="coming_start_btn" class="btn">今から行きます</button>
        <div class="hint">
          順番待ちシステムのため、多少の時間のズレはご了承ください。混雑時にはご要望に添えないこともございます。
        </div>
      </div>
      <div id="coming_step_region" style="display:none;">
        <div class="step-title">今どちらにいますか？</div>
        <button class="region_btn btn btn-outline" data-region="市内">市内</button>
        <button class="region_btn btn btn-outline" data-region="県内">県内</button>
        <button class="region_btn btn btn-outline" data-region="県外">県外</button>
      </div>
      <div id="coming_step_eta" style="display:none;">
        <div class="step-title">どれくらいで来れますか？</div>
        <div id="eta_buttons"></div>
      </div>
      <div class="status-text" id="coming_status"></div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2011582186-tOczwbt7";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyegGawlMgZUxB__fl5Kp38pNjfcOyz0yXAPh_eWm1P-Q_enu72VsMVRy6cIJg4FIix/exec";
    const WAIT_URL = "https://script.google.com/macros/s/AKfycbwXIsGpcMISvTZKBQmVrWWXVNIfJDSODxOm-NF7We19y2JPxEnvESVnMoYO4t1OJ6IDfQ/exec";

    const ETA_OPTIONS = {
      "市内": ["15分圏内", "30分圏内", "1時間圏内"],
      "県内": ["30分圏内", "1時間圏内", "1時間以上"],
      "県外": ["1時間以上"]
    };

    let currentProfile = null;
    let selectedRegion = null;
    let waitAccepting = false;

    function updateActionVisibility() {
      var show = !!currentProfile && waitAccepting;
      document.getElementById('checkin_area').style.display = show ? 'block' : 'none';
      document.getElementById('coming_area').style.display = show ? 'block' : 'none';
    }

    function loadWaitInfo() {
      fetch(WAIT_URL + "?api=1")
        .then(res => res.json())
        .then(d => {
          document.getElementById('wait_title').textContent = d.title;
          document.getElementById('wait_sub').textContent = d.sub;
          waitAccepting = !!d.accepting;
          updateActionVisibility();
        })
        .catch(() => {
          document.getElementById('wait_title').textContent = "待ち時間情報を取得できませんでした";
          document.getElementById('wait_sub').textContent = "";
          waitAccepting = false;
          updateActionVisibility();
        });
    }
    loadWaitInfo();
    setInterval(loadWaitInfo, 30000);

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then((profile) => {
        if (!profile) return;
        currentProfile = profile;
        document.getElementById('result').innerHTML =
          "ユーザーID: " + profile.userId + "<br>表示名: " + profile.displayName + "<br>送信中...";

        return fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            userId: profile.userId,
            displayName: profile.displayName
          })
        }).then(() => {
          document.getElementById('result').innerHTML =
            "ユーザーID: " + profile.userId + "<br>表示名: " + profile.displayName + "<br>送信完了しました";
          updateActionVisibility();
        });
      })
      .catch((err) => {
        document.getElementById('result').innerText = "エラー: " + err;
      });

    document.getElementById('checkin_btn').addEventListener('click', function() {
      if (!currentProfile) return;
      document.getElementById('checkin_status').innerText = "送信中...";
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: "checkin",
          userId: currentProfile.userId,
          displayName: currentProfile.displayName
        })
      }).then(() => {
        document.getElementById('checkin_status').innerText = "受付に連絡しました！";
      });
    });

    document.getElementById('coming_start_btn').addEventListener('click', function() {
      document.getElementById('coming_step_start').style.display = 'none';
      document.getElementById('coming_step_region').style.display = 'block';
    });

    document.querySelectorAll('.region_btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedRegion = btn.getAttribute('data-region');
        document.getElementById('coming_step_region').style.display = 'none';

        var etaDiv = document.getElementById('eta_buttons');
        etaDiv.innerHTML = '';
        ETA_OPTIONS[selectedRegion].forEach(function(eta) {
          var b = document.createElement('button');
          b.textContent = eta;
          b.className = 'btn btn-outline';
          b.addEventListener('click', function() {
            sendComing(selectedRegion, eta);
          });
          etaDiv.appendChild(b);
        });
        document.getElementById('coming_step_eta').style.display = 'block';
      });
    });

    function sendComing(region, eta) {
      if (!currentProfile) return;
      document.getElementById('coming_step_eta').style.display = 'none';
      document.getElementById('coming_status').innerText = "送信中...";
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: "coming",
          userId: currentProfile.userId,
          displayName: currentProfile.displayName,
          region: region,
          eta: eta
        })
      }).then(function() {
        document.getElementById('coming_status').innerText =
          "受付にお伝えしました！（" + region + "・" + eta + "）";
      });
    }
  </script>
</body>
</html>
