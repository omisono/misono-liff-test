<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --green-dark: #14532d;
      --green: #16a34a;
      --green-bg: #eafbf1;
      --green-card: #f0fdf4;
      --gray-text: #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #eafbf1 0%, #ffffff 260px);
      color: #1f2937;
      padding: 20px 16px 40px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .clinic-header { text-align: center; margin-bottom: 18px; }
    .clinic-header .name { font-size: 21px; font-weight: bold; color: var(--green-dark); }
    .card {
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 6px 18px rgba(22,101,52,0.10);
      padding: 28px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .wait-title { font-size: 32px; font-weight: bold; color: var(--green-dark); line-height: 1.4; }
    .wait-sub { font-size: 20px; font-weight: bold; color: var(--gray-text); margin-top: 12px; }
    .closed-days {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .reserve-info {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #1e3a8a;
      background: #eff6ff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .tel-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 22px;
      font-weight: bold;
      color: #1e3a8a;
      text-decoration: none;
    }
    .action-card {
      background: var(--green-card);
      border: 1px solid #dcfce7;
      border-radius: 22px;
      padding: 22px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 28px;
      margin: 6px;
      border: none;
      border-radius: 999px;
      background: var(--green);
      color: white;
      cursor: pointer;
    }
    .btn:active { background: var(--green-dark); }
    .btn-outline {
      background: white;
      color: var(--green-dark);
      border: 2px solid var(--green);
    }
    .hint { font-size: 13px; font-weight: bold; color: var(--gray-text); margin-top: 10px; }
    .status-text { font-size: 18px; font-weight: bold; color: var(--green-dark); margin-top: 10px; }
    .step-title { font-size: 18px; color: var(--green-dark); margin-bottom: 10px; font-weight: bold; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: white;
      border-radius: 18px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .modal-title { font-size: 17px; font-weight: bold; color: var(--green-dark); margin-bottom: 10px; }
    .modal-desc { font-size: 14px; color: #333; margin-bottom: 16px; line-height: 1.6; }
    .modal-input {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="clinic-header">
      <div class="name">🌿 御薗治療院</div>
    </div>

    <div class="closed-days" id="test_notice_info">
      現在テスト運用中です。待ち時間の目安としてお試しください。<br>
      繰り返しテストを行い、問題がなければ本格的に導入する予定です。
    </div>

    <div class="card" id="wait_info">
      <div class="wait-title" id="wait_title">読み込み中...</div>
      <div class="wait-sub" id="wait_sub"></div>
    </div>

    <div class="closed-days" id="closed_days_info">
      定休日：日曜・祝日・月曜　／　水曜は午後休診
    </div>

    <div class="reserve-info" id="reserve_info">
      マッサージ・メタトロンなど、予約が必要な施術がございます。<br>
      ご希望の方はお電話でご予約ください。
      <div><a href="tel:0596227481" class="tel-link">📞 0596-22-7481</a></div>
    </div>

    <div class="action-card" id="coming_area" style="display:none;">
      <div id="coming_step_start">
        <button id="coming_start_btn" class="btn">今から行きます</button>
        <div class="hint">
          順番待ちシステムのため、多少の時間のズレはご了承ください。混雑時にはご要望に添えないこともございます。
        </div>
      </div>
      <div id="coming_step_region" style="display:none;">
        <div class="step-title">今どちらにいますか？</div>
        <button class="region_btn btn btn-outline" data-region="市内">市内</button>
        <button class="region_btn btn btn-outline" data-region="県内">県内</button>
        <button class="region_btn btn btn-outline" data-region="県外">県外</button>
      </div>
      <div id="coming_step_confirm" style="display:none;"></div>
      <div class="status-text" id="coming_status"></div>
    </div>
  </div>

  <div class="modal-overlay" id="name_input_modal">
    <div class="modal-box">
      <div class="modal-title">はじめまして</div>
      <div class="modal-desc">
        受付でどなたか確認するために使用します。<br>
        お名前（フルネーム）をご入力ください。
      </div>
      <input id="name_input_field" class="modal-input" type="text" placeholder="例：御薗太郎">
      <button id="name_input_submit" class="btn" style="width:100%; margin:0;">送信</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2011582186-tOczwbt7";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyegGawlMgZUxB__fl5Kp38pNjfcOyz0yXAPh_eWm1P-Q_enu72VsMVRy6cIJg4FIix/exec";
    const WAIT_URL = "https://script.google.com/macros/s/AKfycbwXIsGpcMISvTZKBQmVrWWXVNIfJDSODxOm-NF7We19y2JPxEnvESVnMoYO4t1OJ6IDfQ/exec";
    const SELF_NAME_STORAGE_KEY = "misono_self_name";

    const ARRIVAL_BUFFER_MINUTES = 10; // 到着目安時刻の手前バッファ
    const MINUTES_PER_WAITING = 8; // 待ち1人あたりの目安分数（サーバー側と統一）
    const CLOSING_SOON_MINUTES = 10; // 診療終了のこの分数前になったら「今から行きます」を締める

    let currentProfile = null;
    let selectedRegion = null;
    let waitAccepting = false;
    let currentWaitingCount = 0;
    let currentSessionEndHhmm = null;

    function updateActionVisibility() {
      var show = !!currentProfile && waitAccepting;
      document.getElementById('coming_area').style.display = show ? 'block' : 'none';
    }

    function hhmmToMinutes(hhmm) {
      return Math.floor(hhmm / 100) * 60 + (hhmm % 100);
    }

    // 診療終了時刻まであと何分か（マイナスなら終了済み、nullなら不明）
    function minutesUntilClose(sessionEndHhmm) {
      if (sessionEndHhmm === null || typeof sessionEndHhmm !== "number") return null;
      var now = new Date();
      var nowMinutes = now.getHours() * 60 + now.getMinutes();
      return hhmmToMinutes(sessionEndHhmm) - nowMinutes;
    }

    function loadWaitInfo() {
      fetch(WAIT_URL + "?api=1")
        .then(res => res.json())
        .then(d => {
          currentWaitingCount = d.waitingCount || 0;
          currentSessionEndHhmm = (typeof d.sessionEndHhmm === "number") ? d.sessionEndHhmm : null;

          var remain = minutesUntilClose(currentSessionEndHhmm);
          var closingSoon = (remain !== null) && remain > 0 && remain <= CLOSING_SOON_MINUTES;

          if (closingSoon) {
            // 終了間際に「今すぐ来院できますか」と促すのはおかしいので、
            // 専用の表示にして「今から行きます」は受け付けない
            document.getElementById('wait_title').textContent = "本日の診療時間の終了" + CLOSING_SOON_MINUTES + "分前です";
            document.getElementById('wait_sub').textContent = "";
            waitAccepting = false;
          } else {
            document.getElementById('wait_title').textContent = d.title;
            document.getElementById('wait_sub').textContent = d.sub;
            waitAccepting = !!d.accepting;
          }
          updateActionVisibility();
        })
        .catch(() => {
          document.getElementById('wait_title').textContent = "待ち時間情報を取得できませんでした";
          document.getElementById('wait_sub').textContent = "";
          waitAccepting = false;
          currentWaitingCount = 0;
          currentSessionEndHhmm = null;
          updateActionVisibility();
        });
    }
    loadWaitInfo();
    setInterval(loadWaitInfo, 30000);

    function getSelfReportedName() {
      try { return localStorage.getItem(SELF_NAME_STORAGE_KEY) || ''; } catch (e) { return ''; }
    }
    function saveSelfReportedName(name) {
      try { localStorage.setItem(SELF_NAME_STORAGE_KEY, name); } catch (e) {}
    }

    function sendProfile(profile, selfName) {
      currentProfile = profile;
      return fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          userId: profile.userId,
          displayName: profile.displayName,
          selfName: selfName || ''
        })
      }).then(() => {
        updateActionVisibility();
      });
    }

    function askSelfName(profile) {
      var modal = document.getElementById('name_input_modal');
      modal.style.display = 'flex';
      document.getElementById('name_input_submit').addEventListener('click', function onSubmit() {
        var val = document.getElementById('name_input_field').value.trim();
        if (!val) {
          alert('お名前を入力してください');
          return;
        }
        saveSelfReportedName(val);
        modal.style.display = 'none';
        sendProfile(profile, val);
      }, { once: true });
    }

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then((profile) => {
        if (!profile) return;
        var existingName = getSelfReportedName();
        if (existingName) {
          return sendProfile(profile, existingName);
        }
        askSelfName(profile);
      })
      .catch((err) => {
        console.error(err);
      });

    document.getElementById('coming_start_btn').addEventListener('click', function() {
      document.getElementById('coming_step_start').style.display = 'none';
      document.getElementById('coming_step_region').style.display = 'block';
    });

    function formatHHMMLabel(date) {
      var h = date.getHours();
      var m = date.getMinutes();
      return h + "時" + (m < 10 ? "0" + m : String(m)) + "分";
    }

    function toHhmmNumber(date) {
      return date.getHours() * 100 + date.getMinutes();
    }

    document.querySelectorAll('.region_btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedRegion = btn.getAttribute('data-region');
        document.getElementById('coming_step_region').style.display = 'none';
        showConfirmStep(selectedRegion);
      });
    });

    function showConfirmStep(region) {
      var confirmDiv = document.getElementById('coming_step_confirm');
      confirmDiv.innerHTML = '';

      if (region === "県外") {
        var farText = document.createElement('div');
        farText.className = 'step-title';
        farText.textContent = "1時間以上かかる見込みとしてお伝えします。1時間圏内に近づきましたら、再度この画面の「今から行きます」からご連絡ください。";
        confirmDiv.appendChild(farText);

        var farBtn = document.createElement('button');
        farBtn.textContent = "受付に伝える";
        farBtn.className = 'btn';
        farBtn.addEventListener('click', function() {
          sendComing(region, "1時間以上", false);
        });
        confirmDiv.appendChild(farBtn);

        confirmDiv.style.display = 'block';
        return;
      }

      // 市内・県内：現在の実際の待ち時間から到着目安時刻を算出して確認する
      var waitMinutes = currentWaitingCount * MINUTES_PER_WAITING;
      var bufferedMinutes = Math.max(waitMinutes - ARRIVAL_BUFFER_MINUTES, 0);
      var targetDate = new Date(Date.now() + bufferedMinutes * 60000);
      var targetLabel = formatHHMMLabel(targetDate);
      var targetHhmm = toHhmmNumber(targetDate);
      var noWait = (bufferedMinutes <= 0);

      var askText = document.createElement('div');
      askText.className = 'step-title';
      if (noWait) {
        askText.textContent = "現在ほとんど待ち時間がありません。今すぐこちらにお越しいただけますか？";
      } else {
        askText.textContent = "現在の待ち時間は概ね" + waitMinutes + "分です。" + targetLabel + "頃までにこちらに到着できますか？";
      }
      confirmDiv.appendChild(askText);

      var yesBtn = document.createElement('button');
      yesBtn.textContent = "はい";
      yesBtn.className = 'btn';
      yesBtn.addEventListener('click', function() {
        var etaLabel = noWait ? "今すぐ来院" : (targetLabel + "到着予定");
        sendComing(region, etaLabel, true);
      });
      confirmDiv.appendChild(yesBtn);

      var noBtn = document.createElement('button');
      noBtn.textContent = "いいえ";
      noBtn.className = 'btn btn-outline';
      noBtn.addEventListener('click', function() {
        confirmDiv.style.display = 'none';
        var statusEl = document.getElementById('coming_status');
        if (currentSessionEndHhmm !== null && targetHhmm >= currentSessionEndHhmm) {
          statusEl.innerText =
            "本日の受付終了時刻までにお越しいただくのが難しい状況です。恐れ入りますがお電話でご相談ください。📞 0596-22-7481";
        } else {
          statusEl.innerText =
            "承知しました。到着予定の20分前ぐらいになりましたら、再度この画面から「今から行きます」でご連絡ください。";
        }
      });
      confirmDiv.appendChild(noBtn);

      confirmDiv.style.display = 'block';
    }

    function sendComing(region, eta, confirmed) {
      if (!currentProfile) return;
      document.getElementById('coming_step_confirm').style.display = 'none';
      document.getElementById('coming_status').innerText = "送信中...";
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: "coming",
          userId: currentProfile.userId,
          displayName: currentProfile.displayName,
          region: region,
          eta: eta,
          confirmed: !!confirmed
        })
      }).then(function() {
        if (eta === "1時間以上") {
          document.getElementById('coming_status').innerText =
            "受付にお伝えしました（" + region + "）。現在1時間以上お待ちいただく見込みです。" +
            "1時間圏内に近づきましたら、恐れ入りますがこの画面から再度「今から行きます」でご連絡ください。" +
            "その時点で受付を開始いたします。";
        } else {
          document.getElementById('coming_status').innerText =
            "受付にお伝えしました！（" + region + "・" + eta + "）";
        }
      });
    }
  </script>
</body>
</html>
