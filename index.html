<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="wait_info" style="text-align:center; margin-bottom:24px; padding:24px 12px; background:#f0fdf4; border-radius:10px;">
    <div id="wait_title" style="font-size:36px; font-weight:bold; color:#166534; line-height:1.4;">読み込み中...</div>
    <div id="wait_sub" style="font-size:24px; color:#333; margin-top:14px;"></div>
  </div>

  <h3>LIFFテストページ</h3>
  <div id="result">読み込み中...</div>

  <div id="checkin_area" style="display:none; margin-top:20px;">
    <button id="checkin_btn" style="font-size:24px; padding:14px 28px;">来院しました</button>
    <div id="checkin_status" style="font-size:18px; margin-top:8px;"></div>
  </div>

  <div id="coming_area" style="display:none; margin-top:24px; padding:16px; background:#eff6ff; border-radius:10px;">
    <div id="coming_step_start">
      <button id="coming_start_btn" style="font-size:24px; padding:14px 28px;">今から行きます</button>
      <div style="font-size:14px; color:#555; margin-top:10px;">
        順番待ちシステムのため、多少の時間のズレはご了承ください。混雑時にはご要望に添えないこともございます。
      </div>
    </div>
    <div id="coming_step_region" style="display:none;">
      <div style="font-size:20px; margin-bottom:10px;">今どちらにいますか？</div>
      <button class="region_btn" data-region="市内" style="font-size:22px; padding:12px 22px; margin:4px;">市内</button>
      <button class="region_btn" data-region="県内" style="font-size:22px; padding:12px 22px; margin:4px;">県内</button>
      <button class="region_btn" data-region="県外" style="font-size:22px; padding:12px 22px; margin:4px;">県外</button>
    </div>
    <div id="coming_step_eta" style="display:none;">
      <div style="font-size:20px; margin-bottom:10px;">どれくらいで来れますか？</div>
      <div id="eta_buttons"></div>
    </div>
    <div id="coming_status" style="font-size:20px; margin-top:10px; font-weight:bold; color:#1e3a8a;"></div>
  </div>

  <script>
    const LIFF_ID = "2011582186-tOczwbt7";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyegGawlMgZUxB__fl5Kp38pNjfcOyz0yXAPh_eWm1P-Q_enu72VsMVRy6cIJg4FIix/exec";
    const WAIT_URL = "https://script.google.com/macros/s/AKfycbwXIsGpcMISvTZKBQmVrWWXVNIfJDSODxOm-NF7We19y2JPxEnvESVnMoYO4t1OJ6IDfQ/exec";

    const ETA_OPTIONS = {
      "市内": ["15分圏内", "30分圏内", "1時間圏内"],
      "県内": ["30分圏内", "1時間圏内", "1時間以上"],
      "県外": ["1時間以上"]
    };

    let currentProfile = null;
    let selectedRegion = null;

    function loadWaitInfo() {
      fetch(WAIT_URL + "?api=1")
        .then(res => res.json())
        .then(d => {
          document.getElementById('wait_title').textContent = d.title;
          document.getElementById('wait_sub').textContent = d.sub;
        })
        .catch(() => {
          document.getElementById('wait_title').textContent = "待ち時間情報を取得できませんでした";
        });
    }
    loadWaitInfo();
    setInterval(loadWaitInfo, 30000);

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then((profile) => {
        if (!profile) return;
        currentProfile = profile;
        document.getElementById('result').innerHTML =
          "ユーザーID: " + profile.userId + "<br>表示名: " + profile.displayName + "<br>送信中...";

        return fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            userId: profile.userId,
            displayName: profile.displayName
          })
        }).then(() => {
          document.getElementById('result').innerHTML =
            "ユーザーID: " + profile.userId + "<br>表示名: " + profile.displayName + "<br>送信完了しました";
          document.getElementById('checkin_area').style.display = 'block';
          document.getElementById('coming_area').style.display = 'block';
        });
      })
      .catch((err) => {
        document.getElementById('result').innerText = "エラー: " + err;
      });

    document.getElementById('checkin_btn').addEventListener('click', function() {
      if (!currentProfile) return;
      document.getElementById('checkin_status').innerText = "送信中...";
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: "checkin",
          userId: currentProfile.userId,
          displayName: currentProfile.displayName
        })
      }).then(() => {
        document.getElementById('checkin_status').innerText = "受付に連絡しました！";
      });
    });

    document.getElementById('coming_start_btn').addEventListener('click', function() {
      document.getElementById('coming_step_start').style.display = 'none';
      document.getElementById('coming_step_region').style.display = 'block';
    });

    document.querySelectorAll('.region_btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedRegion = btn.getAttribute('data-region');
        document.getElementById('coming_step_region').style.display = 'none';

        var etaDiv = document.getElementById('eta_buttons');
        etaDiv.innerHTML = '';
        ETA_OPTIONS[selectedRegion].forEach(function(eta) {
          var b = document.createElement('button');
          b.textContent = eta;
          b.style.fontSize = '22px';
          b.style.padding = '12px 22px';
          b.style.margin = '4px';
          b.addEventListener('click', function() {
            sendComing(selectedRegion, eta);
          });
          etaDiv.appendChild(b);
        });
        document.getElementById('coming_step_eta').style.display = 'block';
      });
    });

    function sendComing(region, eta) {
      if (!currentProfile) return;
      document.getElementById('coming_step_eta').style.display = 'none';
      document.getElementById('coming_status').innerText = "送信中...";
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: "coming",
          userId: currentProfile.userId,
          displayName: currentProfile.displayName,
          region: region,
          eta: eta
        })
      }).then(function() {
        document.getElementById('coming_status').innerText =
          "受付にお伝えしました！（" + region + "・" + eta + "）";
      });
    }
  </script>
</body>
</html>
