<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h3>LIFFテストページ</h3>
  <div id="result">読み込み中...</div>

  <script>
    const LIFF_ID = "2011582184-ebVr37eD";

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then((profile) => {
        if (!profile) return;
        document.getElementById('result').innerHTML =
          "ユーザーID: " + profile.userId + "<br>表示名: " + profile.displayName;
      })
      .catch((err) => {
        document.getElementById('result').innerText = "エラー: " + err;
      });
  </script>
</body>
</html>
