<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>健康とは？｜御薗治療院</title>
  <style>
    :root { --green-dark:#14532d; --green:#16a34a; --green-bg:#eafbf1; --green-card:#f0fdf4; --gray-text:#1f2937; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:linear-gradient(180deg,#eafbf1 0%,#ffffff 260px); color:#1f2937; padding:20px 16px 40px; }
    .container { max-width:480px; margin:0 auto; }
    .clinic-header { text-align:center; margin-bottom:14px; }
    .clinic-header .name { font-size:21px; font-weight:bold; color:var(--green-dark); }
    .page-title { text-align:center; font-size:22px; font-weight:bold; color:var(--green-dark); margin:0 0 6px; }
    .lead { text-align:center; font-size:14px; line-height:1.7; color:#374151; margin:0 0 16px; }
    .back-link { display:inline-block; font-size:15px; font-weight:bold; color:var(--green-dark); text-decoration:none; margin-bottom:8px; padding:6px 4px; }
    .notice { text-align:center; font-size:14px; font-weight:bold; color:#92400e; background:#fef3c7; border-radius:14px; padding:12px; margin-bottom:16px; line-height:1.6; }
    .item { display:flex; align-items:center; gap:12px; width:100%; background:#fff; border:2px solid #bbf7d0; border-radius:18px;
      padding:16px 14px; margin-bottom:12px; text-decoration:none; color:var(--gray-text); box-shadow:0 4px 12px rgba(22,101,52,0.08); }
    a.item:active { background:#f0fdf4; }
    .item .ico { font-size:30px; line-height:1; flex:0 0 auto; }
    .item .txt { flex:1 1 auto; text-align:left; }
    .item .txt b { display:block; font-size:18px; color:var(--green-dark); }
    .item .txt small { display:block; font-size:13px; color:#4b5563; margin-top:3px; line-height:1.5; }
    .item .arrow { font-size:26px; color:var(--green); flex:0 0 auto; }
    .item.primary { background:var(--green); border-color:var(--green); box-shadow:0 6px 16px rgba(22,163,74,0.35); padding:22px 16px; }
    .item.primary .txt b { color:#fff; font-size:21px; }
    .item.primary .txt small { color:#dcfce7; }
    .item.primary .arrow { color:#fff; }
    .item.accent { background:#fffbeb; border-color:#fcd34d; box-shadow:0 4px 12px rgba(180,83,9,0.12); padding:20px 14px; }
    .item.accent .txt b { font-size:20px; color:#92400e; }
    .item.accent .txt small { color:#78350f; }
    .item.accent .arrow { color:#d97706; }
    .item.wip { background:#f3f4f6; border:2px dashed #cbd5e1; box-shadow:none; }
    .item.wip .txt b { color:#6b7280; }
    .item.wip .txt small { color:#9ca3af; }
    .item.wip .ico { filter:grayscale(1); opacity:.6; }
    .badge { flex:0 0 auto; font-size:12px; font-weight:bold; color:#92400e; background:#fde68a; border-radius:999px; padding:4px 10px; }
    details.item-details { background:#fff; border:2px solid #bbf7d0; border-radius:18px; padding:0; margin-bottom:12px; box-shadow:0 4px 12px rgba(22,101,52,0.08); }
    details.item-details summary { list-style:none; cursor:pointer; padding:16px 14px; display:flex; align-items:center; gap:12px; }
    details.item-details summary::-webkit-details-marker { display:none; }
    details.item-details summary .ico { font-size:30px; line-height:1; }
    details.item-details summary b { flex:1; font-size:18px; color:var(--green-dark); }
    details.item-details summary .arrow { font-size:22px; color:var(--green); transition:transform .2s; }
    details.item-details[open] summary .arrow { transform:rotate(90deg); }
    .hours { padding:0 16px 16px; font-size:15px; line-height:1.9; color:var(--gray-text); }
    .hours .closed { color:#b91c1c; font-weight:bold; }
    .item.tel .txt b { font-size:20px; }
    .foot { text-align:center; font-size:12px; color:#6b7280; margin-top:18px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="./">← メニューへ戻る</a>
    <div class="clinic-header">
      <div class="name">🌿 御薗治療院</div>
    </div>
    <h1 class="page-title">健康とは？</h1>
    <p class="lead">
      睡眠・排便・排尿など、身近なテーマから、<br>
      健康の考え方を見直していきます。<br>
      順次追加しますので、しばらくお待ちください。
    </p>

    <a class="item accent" href="cases.html">
      <span class="ico">🎥</span>
      <span class="txt"><b>様々な症例</b><small>動画と経過の文章で、良くなった例を紹介します</small></span>
      <span class="arrow">›</span>
    </a>

    <a class="item" href="sleep.html">
      <span class="ico">🌙</span>
      <span class="txt"><b>睡眠</b><small>「8時間眠らなければ」は、本当でしょうか？</small></span>
      <span class="arrow">›</span>
    </a>
    <a class="item" href="mokuteki.html">
      <span class="ico">🧭</span>
      <span class="txt"><b>手段が目的にすり替わっていませんか？</b><small>医療・社会・AIに共通する問題（イラスト）</small></span>
      <span class="arrow">›</span>
    </a>
    <div class="item wip">
      <span class="ico">🚽</span>
      <span class="txt"><b>排便・排尿</b><small>毎日同じでなければいけないのか</small></span>
      <span class="badge">工事中</span>
    </div>
    <div class="item wip">
      <span class="ico">🍚</span>
      <span class="txt"><b>食事・呼吸</b><small>身体に取り入れるということ</small></span>
      <span class="badge">工事中</span>
    </div>

    <p class="foot">※ 健康状態に不安があるときは、無理をせずご相談ください。</p>
  </div>
</body>
</html>
